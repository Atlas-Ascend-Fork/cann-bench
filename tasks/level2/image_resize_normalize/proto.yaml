operator:
  name: ImageResizeNormalize
  category: FusedComposite
  difficulty: L2
  formula: y = (resize_bilinear(x, [out_h, out_w]) - mean) / std
  description: 将 NCHW 图像张量双线性 resize 到固定尺寸后按 channel 做 normalize
  shape_support: 'x: [B,C,H,W], mean/std: [C], y: [B,C,out_h,out_w]'
  attrs:
  - name: out_h
    type: int
    default: 224
    description: 输出高度
    required: false
  - name: out_w
    type: int
    default: 224
    description: 输出宽度
    required: false
  - name: align_corners
    type: bool
    default: false
    description: 双线性插值是否对齐角点
    required: false
  inputs:
  - name: x
    description: 输入图像张量
    dtype: &id001
    - float16
    - bfloat16
    - float32
    shape: '[B,C,H,W]'
  - name: mean
    description: channel mean
    dtype: *id001
    shape: '[C]'
  - name: std
    description: channel std
    dtype: *id001
    shape: '[C]'
  outputs:
  - name: y
    description: resize + normalize 输出
    dtype: *id001
    shape: '[B,C,out_h,out_w]'
  schema: image_resize_normalize(Tensor x, Tensor mean, Tensor std, int out_h=224,
    int out_w=224, bool align_corners=False) -> Tensor y
