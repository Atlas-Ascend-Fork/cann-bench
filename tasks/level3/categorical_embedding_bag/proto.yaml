operator:
  name: CategoricalEmbeddingBag
  category: Index
  difficulty: L3
  formula: tokens[b,f] = sum_or_mean(embedding_table[indices[b,f,:]]) + optional bias[f]
  description: 对 tabular 类别特征的 bag 维度执行 embedding lookup 与 sum/mean pooling
  shape_support: 'indices: [B,F,K], embedding_table: [V,D], bias: [F,D] or null, tokens:
    [B,F,D]'
  attrs:
  - name: mean_pool
    type: bool
    default: false
    description: true 时对 bag 做 mean pooling，否则做 sum pooling
    required: false
  - name: padding_idx
    type: int
    default: -1
    description: 等于该 id 的位置不参与 pooling
    required: false
  inputs:
  - name: indices
    description: 类别 id bag
    dtype:
    - int32
    - int64
    shape: '[B,F,K]'
  - name: embedding_table
    description: embedding 表
    dtype: &id001
    - float16
    - bfloat16
    - float32
    shape: '[V,D]'
  - name: bias
    description: 可选 per-feature bias
    dtype: *id001
    shape: '[F,D] or null'
    optional: true
  outputs:
  - name: tokens
    description: 类别 token 输出
    dtype: *id001
    shape: '[B,F,D]'
  schema: categorical_embedding_bag(Tensor indices, Tensor embedding_table, Tensor?
    bias=None, bool mean_pool=False, int padding_idx=-1) -> Tensor tokens
