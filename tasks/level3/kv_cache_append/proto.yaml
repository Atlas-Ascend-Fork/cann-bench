operator:
  name: KvCacheAppend
  category: Transform
  difficulty: L3
  formula: "cache_out.reshape(-1,H,D)[slot_mapping] = new_token"
  description: 将 decode 新生成的 K/V token 按 slot_mapping 写入分页 KV cache
  shape_support: "cache: [Blocks,Page,Hkv,D], new_k/new_v: [T,Hkv,D], slot_mapping: [T]"
  inputs:
  - name: k_cache
    description: 原 K cache
    dtype:
    - float16
    - bfloat16
    - float32
    shape: "[num_blocks, page_block_size, Hkv, D]"
  - name: v_cache
    description: 原 V cache
    dtype:
    - float16
    - bfloat16
    - float32
    shape: "[num_blocks, page_block_size, Hkv, D]"
  - name: new_k
    description: 待写入 K token
    dtype:
    - float16
    - bfloat16
    - float32
    shape: "[T, Hkv, D]"
  - name: new_v
    description: 待写入 V token
    dtype:
    - float16
    - bfloat16
    - float32
    shape: "[T, Hkv, D]"
  - name: slot_mapping
    description: 线性 cache slot
    dtype:
    - int32
    - int64
    shape: "[T]"
  outputs:
  - name: k_cache_out
    description: 写入后的 K cache
    dtype:
    - float16
    - bfloat16
    - float32
    shape: "[num_blocks, page_block_size, Hkv, D]"
    # 允许返回输入 cache 的别名；公开接口要求显式返回两个输出 Tensor。
  - name: v_cache_out
    description: 写入后的 V cache
    dtype:
    - float16
    - bfloat16
    - float32
    shape: "[num_blocks, page_block_size, Hkv, D]"
  schema: kv_cache_append(Tensor k_cache, Tensor v_cache, Tensor new_k, Tensor new_v, Tensor slot_mapping) -> (Tensor k_cache_out, Tensor v_cache_out)
