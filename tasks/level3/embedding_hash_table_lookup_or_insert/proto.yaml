operator:
  name: EmbeddingHashTableLookupOrInsert
  category: HashTable
  difficulty: L3
  formula: |
    slot = key mod bucket_size
    values[i] = 0                        if filtered
              = table_values[slot]       if table_keys[slot] >= 0
              = init_vector(key[winner]) otherwise (first-insert-wins, winner = min flattened index)
    init_vector(k)[j] = float32((lo32(k*2654435761) XOR lo32(j*2654435769)) & 0x7FF) * 2^-10 - 1.0
  description: 直接映射哈希表查找/插入算子（表状态为显式输入）；命中返回已存向量，未命中按first-insert-wins插入key派生的确定性初始化向量，输出附带每查询状态flags
  shape_support: 'table_keys: [bucket_size]; table_values: [bucket_size, embedding_dim]; keys: 任意形状(非负int64); values: (N, embedding_dim); flags: (N)'
  attrs:
  - name: bucket_size
    type: int
    description: 哈希表容量（必选），须等于table_keys.shape[0]与table_values.shape[0]
    required: true
  - name: embedding_dim
    type: int
    description: value的维度（必选），须等于table_values.shape[1]
    required: true
  - name: filter_key_flag
    type: bool
    default: "false"
    description: 启用filter_key功能
    required: false
  - name: filter_key
    type: int
    default: "-1"
    description: 被过滤的key（仅filter_key_flag=True时生效）；被过滤查询输出全0行且不探查不插入
    required: false
  inputs:
  - name: table_keys
    description: slot占用标记，>=0为占用、<0为空，shape为[bucket_size]
    dtype:
    - int64
    shape: '[bucket_size]'
  - name: table_values
    description: 各slot已存的embedding，shape为[bucket_size, embedding_dim]
    dtype:
    - float32
    shape: '[bucket_size, embedding_dim]'
  - name: keys
    description: 要查找/插入的key序列（非负），按C序展平
    dtype:
    - int64
    shape: '任意形状'
  outputs:
  - name: values
    description: 命中值/插入的初始化向量/过滤全0行，shape为(N, embedding_dim)
    dtype:
    - float32
    shape: '(N, embedding_dim)'
  - name: flags
    description: 每查询状态，0=被过滤，1=本查询执行插入，2=命中
    dtype:
    - int32
    shape: '(N)'
  schema: embedding_hash_table_lookup_or_insert(Tensor table_keys, Tensor table_values, Tensor keys, int bucket_size, int embedding_dim, bool filter_key_flag=False, int filter_key=-1) -> (Tensor values, Tensor flags)
