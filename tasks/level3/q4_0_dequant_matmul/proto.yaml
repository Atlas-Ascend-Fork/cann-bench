operator:
  name: Q4_0DequantMatmul
  category: Contraction
  difficulty: L3
  formula: "y = x @ dequant_q4_0(qweight, scales).T"
  description: 严格按照 GGUF Q4_0 block 格式完成权重反量化和矩阵乘
  shape_support: "x: [..., K], qweight: [N*K/2], scales: [N, K/32], K % 32 == 0"
  attrs:
  - {name: out_features, type: int, required: true, description: 输出特征 N}
  - {name: in_features, type: int, required: true, description: 输入特征 K}
  - {name: block_size, type: int, default: 32, required: false, description: Q4_0 固定 block size，仅允许 32}
  - {name: quant_type, type: str, default: "q4_0", required: false, description: 首版仅支持 q4_0}
  inputs:
  - {name: x, description: activation 输入, dtype: [float16, bfloat16, float32], shape: "[..., K]"}
  - {name: qweight, description: "按 [N, K/32, 16] 展平的 Q4_0 packed codes", dtype: [uint8], shape: "[N*K/2]"}
  - {name: scales, description: 从 Q4_0 block 提取的 FP16 scale, dtype: [float16], shape: "[N, K/32]"}
  outputs:
  - {name: y, description: matmul 输出, dtype: [float16, bfloat16, float32], shape: "[..., N]"}
  schema: q4_0_dequant_matmul(Tensor x, Tensor qweight, Tensor scales, int out_features, int in_features, int block_size=32, str quant_type="q4_0") -> Tensor y
