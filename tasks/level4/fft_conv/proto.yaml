operator:
  name: FftConv
  category: FusedComposite
  difficulty: L4
  formula: |
    U = rfft(u, n=2L)                        # 实数 FFT，长度 2L 零填充避免循环混叠
    K = rfft(k_filter, n=2L)
    y = irfft(U ⊙ K, n=2L)[..., :L]          # 频域逐点复乘 + 逆 FFT，截取前 L 点（因果线性卷积）
    y = y + u ⊙ bias                          # 残差门控
  description: Hyena 长卷积算子，基于 FFT 的因果全局线性卷积 + 残差门控融合
  shape_support: "u [B, D, L]，k_filter [D, L]，bias [D]，输出 y [B, D, L]"
  # FFT 蝶形求和顺序与时域直接卷积/不同基分解差异较大，且输出为 L 项随机乘积之和
  # （存在相消），仅支持 float32；相对生态标准适度放宽（float32 0.001，MARE 阈值 = 0.01），
  # 小值域/相消场景由评测框架兜底标准处理。
  precision_thresholds:
    float32: 0.001
  attrs: []
  inputs:
  - name: u
    description: 输入序列（通道优先布局）
    dtype:
    - float32
    shape: "[B, D, L]"
  - name: k_filter
    description: 时域全局滤波器（每通道一条长度 L 的隐式卷积核）
    dtype:
    - float32
    shape: "[D, L]"
  - name: bias
    description: 残差门控系数（逐通道），输出叠加 u ⊙ bias
    dtype:
    - float32
    shape: "[D]"
  outputs:
  - name: y
    description: 因果全局卷积输出，shape 与 u 一致
    dtype:
    - float32
    shape: "[B, D, L]"
  schema: fft_conv(Tensor u, Tensor k_filter, Tensor bias) -> Tensor y
