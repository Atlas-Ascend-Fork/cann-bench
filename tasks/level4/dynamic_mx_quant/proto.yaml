operator:
  name: DynamicMxQuant
  category: Quantization
  difficulty: L4
  platform: Ascend 950PR / 950DT
  formula: |
    shared_exp = floor(log2(max(|V_i|))) - emax;
    mxscale = 2^shared_exp;
    y_i = cast(V_i / mxscale, round_mode)
  description: 对输入张量执行 Microscaling (MX) 动态量化，按 blocksize 分组计算 E8M0 共享尺度，输出低精度量化结果和对应的量化 scale；采用标准 OCP MX 算法 (floor(log2(amax)) - emax)，仅支持该 scale 计算方法
  shape_support: 输入支持 1-7D 张量，输出 y 与输入同 shape（dst_type 为 FP4 时最后一维减半，两元素打包为一个 uint8），mxscale 与 x 同 rank，量化轴维 = ceil(x.shape[axis]/blocksize)，其余维度与 x 一致
  attrs:
  - name: axis
    type: int
    default: -1
    description: 量化轴，范围 [-rank, rank-1]
    required: false
  - name: round_mode
    type: str
    default: rint
    description: 舍入模式，支持 rint/floor/round（FP8 目标类型仅支持 rint）
    required: false
  - name: dst_type
    type: int
    default: 40
    description: 输出量化类型编码，35=FP8_E5M2, 36=FP8_E4M3FN, 40=FP4_E2M1, 41=FP4_E1M2
    required: true
  - name: blocksize
    type: int
    default: 32
    description: 量化分组大小，32 的倍数且不超过 1024
    required: false
  inputs:
  - name: x
    description: 输入张量，1-7 维；目标类型为 FP4 时最后一维必须为偶数
    dtype:
    - float16
    - bfloat16
  outputs:
  - name: y
    description: 量化后的输出张量，与输入同 shape（dst_type 为 FP4 时最后一维减半，两元素打包为一个 uint8）
    dtype:
    - float8_e5m2
    - float8_e4m3fn
    - float4_e2m1
    - float4_e1m2
  - name: mxscale
    description: 量化 scale 张量，dtype 为 FP8_E8M0 (float8_e8m0fnu)，与 x 同 rank，量化轴维 = ceil(x.shape[axis]/blocksize)，其余维度与 x 一致
    dtype:
    - float8_e8m0fnu
  schema: dynamic_mx_quant(Tensor x, int axis=-1, str round_mode="rint", int dst_type=40, int blocksize=32) -> (Tensor y, Tensor mxscale)
