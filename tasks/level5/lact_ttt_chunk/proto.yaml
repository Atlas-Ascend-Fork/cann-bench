operator:
  name: LactTttChunk
  category: FusedComposite
  difficulty: L5
  formula: |
    q̂, k̂ = q, k 沿 D 做 L2 归一化（eps 1e-6）；快权重 f_W(x) = W2 [SiLU(W1 x) ⊙ (W3 x)]
    序列按 chunk_size 切块，对每块 I_c（update_first=False 时先 apply 后 update）：
      apply:  y_t = f_{W^{(c)}}(q̂_t)，t ∈ I_c
      update: ℒ = Σ_{i∈I_c} lr_i · (−f_W(k̂_i)ᵀ v_i)，g = ∇_W ℒ（W1/W2/W3 闭式梯度）
              Δ = Muon(g)（use_muon=True，Newton–Schulz 5 步 zeropower）或 g
              W ← RowL2Normalize(W − Δ)（逐输出神经元 L2 归一，eps 1e-6）
    输出 y 与最终快权重 w1_out / w2_out / w3_out
  description: Large-Chunk Test-Time Training（LaCT）层前向，SwiGLU 快权重以大 chunk 为单位做一步梯度更新（可选 Muon 正交化）
  shape_support: "q/k/v [B, L, H, D]，w1/w3 [B, H, Dh, D]，w2 [B, H, D, Dh]，lr [B, L, H]；输出 y [B, L, H, D]，w1_out/w2_out/w3_out 与输入快权重同 shape"
  # 块间串行的快权重链（最多 L/chunk_size 步）放大误差，Muon 的 Newton–Schulz 5 步
  # 迭代对输入扰动敏感。阈值用仓库 checker (kernel_eval.utils.compare.compare_tensors,
  # native=plain golden) 实测确定：fp32 数据通路（快权重 fp32 驻留、matmul fp32 累加）
  # 的误差下限在 L=2048~4096、D=128、Dh=256 下为 bf16 MERE≈1e-6 / MARE≈4.4e-2，
  # fp16 MERE≈1.5e-7 / MARE≈9.7e-4，fp32+muon MERE≈4.8e-6 / 正常值域 MARE≈2.0e-3
  # （MARE 尖峰位于相消/小值域，由评测框架兜底标准处理）；matmul 操作数整体降 bf16
  # 时实测 MERE 达 1.1e-2 且小值域兜底必失败，故要求快权重与梯度链以 fp32 保存/累加、
  # Muon 全程 fp32。取 bfloat16 0.02（MARE 阈值 0.2 覆盖实测 4.4e-2）、float16 0.005
  # （MARE 阈值 0.05 覆盖实测 9.7e-4）、float32 0.001（MARE 阈值 0.01 覆盖实测 2.0e-3），
  # 与同类先例 mamba2_ssd / flash_attention_backward 的放宽幅度一致。
  precision_thresholds:
    float32: 0.001
    float16: 0.005
    bfloat16: 0.02
  attrs:
  - name: chunk_size
    type: int
    default: 2048
    description: TTT 块大小 C，序列按 C 切块、末块按实际长度处理；影响数学结果（每块一步权重更新）
    required: false
  - name: use_muon
    type: bool
    default: false
    description: True 时权重增量 Δ = Muon(g)（Newton–Schulz 5 步 zeropower，系数 a=3.4445, b=−4.7750, c=2.0315），False 时 Δ = g
    required: false
  - name: update_first
    type: bool
    default: false
    description: False 为 apply-then-update（因果，块内用进入该块前的权重），True 为 update-then-apply（双向，块内可见未来）
    required: false
  inputs:
  - name: q
    description: 查询张量，算子内部沿 D 做 L2 归一化后送入快权重网络
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B, L, H, D]"
  - name: k
    description: 键张量，算子内部沿 D 做 L2 归一化后作为快权重更新的输入
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B, L, H, D]"
  - name: v
    description: 值张量，快权重更新的回归目标（负内积损失）
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B, L, H, D]"
  - name: w1
    description: 快权重 W1（SwiGLU 门分支），逐样本、逐头独立
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B, H, Dh, D]"
  - name: w2
    description: 快权重 W2（输出投影），逐样本、逐头独立
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B, H, D, Dh]"
  - name: w3
    description: 快权重 W3（SwiGLU 线性分支），逐样本、逐头独立
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B, H, Dh, D]"
  - name: lr
    description: 逐 token 逐头学习率，要求恒正（评测取值范围 [0.001, 0.05]）
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B, L, H]"
  outputs:
  - name: y
    description: 输出序列 y_t = f_W(q̂_t)，dtype 与 q 一致
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B, L, H, D]"
  - name: w1_out
    description: 序列末尾的快权重 W1，dtype 与 q 一致
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B, H, Dh, D]"
  - name: w2_out
    description: 序列末尾的快权重 W2，dtype 与 q 一致
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B, H, D, Dh]"
  - name: w3_out
    description: 序列末尾的快权重 W3，dtype 与 q 一致
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B, H, Dh, D]"
  schema: lact_ttt_chunk(Tensor q, Tensor k, Tensor v, Tensor w1, Tensor w2, Tensor w3, Tensor lr, int chunk_size=2048, bool use_muon=False, bool update_first=False) -> (Tensor y, Tensor w1_out, Tensor w2_out, Tensor w3_out)
