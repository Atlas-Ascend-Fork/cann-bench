operator:
  category: FusedComposite
  difficulty: L5
  name: KimiDeltaAttention
  description: Kimi Delta Attention的门控状态递推核心；可选QK归一化；输出序列及最终状态。
  formula: Q,K optionally x/sqrt(sum(x*x)+1e-6); A=diag(exp(g_t)); Hbar=A@Hprev; r=v_t-k_t^T@Hbar; H=Hbar+beta_t*k_t@r^T;
    y_t=scale*q_t^T@H
  shape_support: q,k,g:[B,T,H,Dk]; v:[B,T,H,Dv]; beta:[B,T,H]; state:[B,H,Dk,Dv]; equal Q/K/V head counts
  inputs:
  - name: q
    shape: '[B,T,H,Dk]'
    dtype: &id001
    - float16
    - bfloat16
    - float32
    description: 未归一化或按属性直接使用的查询
  - name: k
    shape: '[B,T,H,Dk]'
    dtype: *id001
    description: 键；归一化属于被测计算
  - name: v
    shape: '[B,T,H,Dv]'
    dtype: *id001
    description: 值
  - name: g
    shape: '[B,T,H,Dk]'
    dtype:
    - float32
    description: 逐token逐key通道自然对数衰减；不是累计gate
  - name: beta
    shape: '[B,T,H]'
    dtype:
    - float32
    description: 直接给定写入强度[0,1]；不再sigmoid
  - name: initial_state
    shape: '[B,H,Dk,Dv]'
    dtype:
    - float32
    description: 必选初态；无历史时传零张量；不可原地修改
  outputs:
  - name: y
    shape: '[B,T,H,Dv]'
    dtype: *id001
    description: dtype与q一致
  - name: final_state
    shape: '[B,H,Dk,Dv]'
    dtype:
    - float32
    description: 末态；必须参与精度比较
  attrs:
  - name: use_qk_l2norm
    type: bool
    default: true
    description: 是否在核心中对Q/K按sum(x²)+1e-6归一化
  - name: scaleValue
    type: float
    default: -1.0
    description: <=0自动1/sqrt(Dk)；>0使用显式值；仅缩放读取输出
  schema: kimi_delta_attention(Tensor q, Tensor k, Tensor v, Tensor g, Tensor beta, Tensor initial_state, bool use_qk_l2norm=True,
    float scaleValue=-1.0) -> (Tensor y, Tensor final_state)
