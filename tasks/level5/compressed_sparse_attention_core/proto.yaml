operator:
  category: FusedComposite
  difficulty: L5
  name: CompressedSparseAttentionCore
  description: V4 CSA核心子图：压缩KV稀疏条目与128滑窗条目共用带sink的softmax；不含压缩器或索引搜索。
  formula: t=query_start+i; E=raw[max(0,t-127):t+1] concatenated with selected completed compressed blocks; z=scale*Q@E^T;
    y=sum(exp(z)*E)/(sum(exp(z))+exp(attn_sink))
  shape_support: query:[B,S,H,D]; compressed_kv:[B,floor((query_start+S)/4),D]; window_kv:[B,S+min(query_start,127),D]; indices:[B,S,K];
    sink:[H]
  inputs:
  - name: query
    shape: '[B,S,H,D]'
    dtype: &id001
    - float16
    - bfloat16
    - float32
    description: 已完成投影和位置处理的query
  - name: compressed_kv
    shape: '[B,C,D]'
    dtype: *id001
    description: 已压缩且已完成位置处理的共享K=V；C=floor((query_start+S)/4)
  - name: window_kv
    shape: '[B,Lw,D]'
    dtype: *id001
    description: 时间连续的共享K=V原始缓存；起点max(0,query_start-127)
  - name: compressed_indices
    shape: '[B,S,K]'
    dtype:
    - int32
    description: 每行有效压缩块id唯一且已完成；-1为padding
  - name: attn_sink
    shape: '[H]'
    dtype:
    - float32
    description: 各头sink logit；仅进入softmax分母
  outputs:
  - name: y
    shape: '[B,S,H,D]'
    dtype: *id001
    description: 逆RoPE/输出投影之前的核心输出；dtype同query
  attrs:
  - name: query_start
    type: int
    default: 0
    description: 本次首个query的零基绝对token位置
  - name: scaleValue
    type: float
    default: -1.0
    description: <=0自动1/sqrt(D)；>0显式缩放；基准扩展属性
  schema: compressed_sparse_attention_core(Tensor query, Tensor compressed_kv, Tensor window_kv, Tensor compressed_indices, Tensor attn_sink,
    int query_start=0, float scaleValue=-1.0) -> Tensor y
