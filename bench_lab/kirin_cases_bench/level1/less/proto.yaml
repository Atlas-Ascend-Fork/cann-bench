operator:
  name: Less
  category: Elementwise
  difficulty: L1
  formula: y[i] = (x1[i] < x2[i])
  description: 逐元素小于比较，输出 bool（kernel 内 uint8 0x00/0x01）；kernel 将输入展平为 1D 处理，tiling 仅依赖总元素数；IEEE754 语义（NaN 比较 False，+0 == -0）
  shape_support: 输入两个同 shape 2D 张量 [N, M]，N∈[1,256]，M∈[1,1024]，总元素数∈[1, 262144]；x1/x2 同 shape 同 dtype
  precision_thresholds:
    float32: 0.0
    float16: 0.0
    int32: 0.0
    int16: 0.0
    int8: 0.0
    uint32: 0.0
    uint16: 0.0
    uint8: 0.0
  attrs: []
  inputs:
  - name: x1
    description: 输入张量 1 [N, M]
    dtype:
    - float32
    - float16
    - int32
    - int16
    - int8
    - uint32
    - uint16
    - uint8
  - name: x2
    description: 输入张量 2 [N, M]，与 x1 同 shape 同 dtype
    dtype:
    - float32
    - float16
    - int32
    - int16
    - int8
    - uint32
    - uint16
    - uint8
  outputs:
  - name: y
    description: 输出 bool 张量（kernel 输出 uint8 0x00/0x01），shape 与输入一致
    dtype:
    - uint8
  schema: less(Tensor x1, Tensor x2) -> Tensor y
