operator:
  name: Yuv420ToRgb
  category: ImageColorTransform
  difficulty: L2
  formula: BT.601 limited range YUV420p -> RGB（OpenCV COLOR_YUV2RGB_I420 标量算法，常数 ITUR_BT_601_*）
  description: YUV420 plane(I420/YU12) -> RGB 交错；输入为 [3H/2, W] uint8 紧凑缓冲（Y 平面 [H,W] + U 平面 [H/2,W/2] + V 平面 [H/2,W/2]），输出 [H, W, 3]；逐字节复刻 OpenCV cvtYuv42xxp2RGB8
  shape_support: H∈[16,1080] 且为偶数，W∈[16,1920] 且为偶数，总元素数∈[384, 3110400]
  precision_thresholds:
    uint8: 0.0
  attrs: []
  inputs:
  - name: x
    description: 输入紧凑缓冲 [3H/2, W] uint8（Y/U/V 平面拼接）
    dtype:
    - uint8
  outputs:
  - name: y
    description: 输出 RGB 交错图像 [H, W, 3] uint8
    dtype:
    - uint8
  schema: yuv420_to_rgb(Tensor x) -> Tensor y
