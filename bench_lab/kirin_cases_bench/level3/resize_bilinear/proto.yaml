operator:
  name: ResizeBilinear
  category: ImageResize
  difficulty: L3
  formula: OpenCV cv2.resize(x, (out_w, out_h), interpolation=INTER_LINEAR) 的 8U 定点双线性（含精确 2x 盒式平均快速路径）
  description: 单通道 2D uint8 双线性缩放，标杆为 OpenCV INTER_LINEAR 8U（逐字节一致，atol=0）；三条互斥路径（恒等拷贝 / 精确 2x 双维下采样盒式平均 / 通用 11bit 定点双线性）；水平轴边缘权重清零 replicate、垂直轴仅行号裁剪（不对称），融合舍入 >>4 截断不可省略
  shape_support: 输入 [H, W] uint8，H∈[8,2160]，W∈[8,3840]，总元素∈[64, 8294400]；out_h/out_w∈[4,2160]，缩小 ≤32x、放大 ≤8x，out_h*out_w ≤ 4194304；恒等缩放不在测试范围
  precision_thresholds:
    uint8: 0.0
  attrs:
  - name: out_h
    type: int64
    description: 输出高，[4,2160]，用例实际取值见 cases.yaml
    required: true
  - name: out_w
    type: int64
    description: 输出宽，[4,2160]，用例实际取值见 cases.yaml
    required: true
  inputs:
  - name: x
    description: 输入图像 [H, W] uint8（单通道 2 维，ND 平坦布局，W 可为任意值）
    dtype:
    - uint8
  outputs:
  - name: y
    description: 输出图像 [out_h, out_w] uint8
    dtype:
    - uint8
  schema: resize_bilinear(Tensor x, int out_h, int out_w) -> Tensor y
