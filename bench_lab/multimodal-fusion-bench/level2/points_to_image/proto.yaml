operator:
  name: PointsToImage
  category: Geometry
  difficulty: L2
  formula: pixel_coords = (P @ [x, y, z, 1]^T)[0:2] / max((P @ [x, y, z, 1]^T)[2], eps)
  description: 将三维点通过相机投影矩阵投影到二维图像平面
  shape_support: points_3d支持任意前缀维度且最后一维为3，proj_matrix支持(3,4)或(B,3,4)，输出最后一维为2
  attrs:
  - name: eps
    type: float
    default: 1.0e-6
    description: 深度分母最小值，用于避免除零
  note: 仅执行齐次坐标投影，不做图像边界裁剪和有效性过滤
  inputs:
  - name: points_3d
    description: 三维点坐标，最后一维为(x,y,z)
    dtype:
    - float16
    - float32
    - float64
  - name: proj_matrix
    description: 相机投影矩阵，shape为(3,4)或(B,3,4)
    dtype:
    - float16
    - float32
    - float64
  outputs:
  - name: pixel_coords
    description: 二维像素坐标，最后一维为(u,v)
    dtype:
    - float16
    - float32
    - float64
  schema: points_to_image(Tensor points_3d, Tensor proj_matrix, float eps=1e-6) -> Tensor pixel_coords
